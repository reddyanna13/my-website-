<!DOCTYPE 
html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reddyanna - Login & Register</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      background: white;
      width: 90%;
      max-width: 360px;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0002;
      box-sizing: border-box;
    }
    h2 { text-align: center; color: #173b72; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 9px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #175cd3;
      color: white;
      border: none;
      cursor: pointer;
    }
    .switch {
      text-align: center;
      color: #175cd3;
      cursor: pointer;
      margin-top: 16px;
    }
    #message { text-align: center; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2 id="heading">Login</h2>
    <form id="authForm">
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
      <button id="submitBtn" type="submit">Login</button>
    </form>
    <p class="switch" id="switchBtn">New user? Register here</p>
    <p id="message"></p>
  </div>
  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_PROJECT_URL_HERE';
    const SUPABASE_ANON_KEY = 'PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isRegister = false;
    const heading = document.getElementById('heading');
    const submitBtn = document.getElementById('submitBtn');
    const switchBtn = document.getElementById('switchBtn');
    const message = document.getElementById('message');

    switchBtn.onclick = () => {
      isRegister = !isRegister;
      heading.textContent = isRegister ? 'Create Account' : 'Login';
      submitBtn.textContent = isRegister ? 'Register' : 'Login';
      switchBtn.textContent = isRegister
        ? 'Already registered? Login here'
        : 'New user? Register here';
      message.textContent = '';
    };

    document.getElementById('authForm').onsubmit = async (event) => {
      event.preventDefault();
      message.textContent = 'Please wait...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const result = isRegister
          ? await supabase.auth.signUp({ email, password })
          : await supabase.auth.signInWithPassword({ email, password });

        if (result.error) throw result.error;

        message.textContent = isRegister
          ? 'Registration submitted. Check your email if verification is required.'
          : 'Login successful!';

        if (!isRegister && result.data.session) {
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        message.textContent = error.message;
      }
    };
  </script>
</body>
</html>
